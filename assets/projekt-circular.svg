<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img" aria-labelledby="t d">
<title id="t">circular-navigation</title>
<desc id="d">Circular Navigation: animiertes kreisförmiges Navigationsmenü mit acht Menüpunkten, gestaffelten Übergängen und hervorgehobener Auswahl, umgesetzt mit HTML, CSS und Vanilla JavaScript.</desc>
<style>
.l{animation:rv .45s ease-out both}
.c{animation:bl 1.1s steps(1) infinite}
.eq{transform-box:fill-box;transform-origin:50% 100%;animation:eq 1.4s ease-in-out infinite alternate}
@keyframes rv{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
@keyframes bl{50%{opacity:0}}
@keyframes eq{from{transform:scaleY(.35)}to{transform:scaleY(1)}}
@media (prefers-reduced-motion:reduce){.l,.c,.eq{animation:none}}
</style>
