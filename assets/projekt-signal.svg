<title id="t">signal-radio-tv</title>
<desc id="d">SIGNAL Studio: Webanwendung für Radio und Live-TV mit PHP, MySQL, JavaScript und HLS.js. TV-Player für HLS und MP4, Radio-Player auch als WordPress-Shortcode, gemeinsame Verwaltung mit CSRF-Schutz. Mit Live-Demo auf GitHub Pages.</desc>
