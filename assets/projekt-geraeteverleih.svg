<title id="t">geraeteverleih</title>
<desc id="d">Geräteverleih: Flask-Webanwendung zur Ausleihe von Geräten. Doppelte Ausleihe per partiellem Index verhindert, idempotente Rückgabe, Transaktionen mit Rollback, CSRF-Schutz, 62 pytest-Tests mit GitHub Actions, mit statischer Live-Demo auf GitHub Pages. Rechts ein Datenmodell mit den Tabellen devices, persons und loans.</desc>
