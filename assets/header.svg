<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">Ario – Umschulung zum Fachinformatiker für Anwendungsentwicklung</title>
  <desc id="d">Dunkler Banner mit Namen, Berufsziel und einer abstrakten Balkengrafik.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1b2a"/>
      <stop offset="1" stop-color="#14263a"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="320" rx="14" fill="url(#bg)"/>

  <!-- feines Raster -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <path d="M0 80H1200M0 160H1200M0 240H1200"/>
    <path d="M300 0V320M600 0V320M900 0V320"/>
  </g>

  <!-- abstrakte Balkengrafik -->
  <g transform="translate(760 0)">
    <rect x="0"   y="190" width="36" height="90"  rx="3" fill="url(#bar)"/>
    <rect x="56"  y="150" width="36" height="130" rx="3" fill="url(#bar)"/>
    <rect x="112" y="210" width="36" height="70"  rx="3" fill="url(#bar)"/>
    <rect x="168" y="110" width="36" height="170" rx="3" fill="url(#bar)"/>
    <rect x="224" y="170" width="36" height="110" rx="3" fill="url(#bar)"/>
    <rect x="280" y="90"  width="36" height="190" rx="3" fill="url(#bar)"/>
    <rect x="336" y="140" width="36" height="140" rx="3" fill="url(#bar)"/>
    <path d="M-20 280H392" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.5"/>
  </g>

  <!-- Akzentlinie -->
  <rect x="72" y="84" width="48" height="3" fill="#2dd4bf"/>

  <!-- Text -->
  <text x="72" y="72" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" letter-spacing="4" fill="#94a3b8">GITHUB-PROFIL</text>
  <text x="68" y="190" font-family="Georgia, 'Times New Roman', serif" font-size="108" font-weight="700" fill="#f8fafc">Ario</text>
  <text x="72" y="238" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#cbd5e1">Anwendungsentwicklung · Umschulung zum Fachinformatiker</text>
  <text x="72" y="272" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" letter-spacing="1" fill="#2dd4bf">Python · Java · SQL · JavaScript</text>
