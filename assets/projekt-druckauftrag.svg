<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 476" width="1200" height="476" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
<title id="t">druckauftrag-manager</title>
<desc id="d">Druckauftrag-Manager: Auftragsverwaltung für eine kleine Digitaldruckerei mit Java 21, Spring Boot, Spring Data JPA, Thymeleaf und H2. Statusablauf vom Eingang bis zur Abholung, Preisberechnung nach Auflage, Format und Papier mit BigDecimal, Übersicht mit fälligen und überfälligen Aufträgen, Validierung und JUnit-5-Tests. Rechts ein Datenmodell mit den Tabellen kunde und auftrag sowie dem Status-Ablauf.</desc>
