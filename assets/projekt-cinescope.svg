<title id="t">cinescope-php</title>
<desc id="d">CineScope: Filmportal mit PHP 8.2, PDO und MySQL/MariaDB. Suche nach Titel, Jahr, Schauspieler, Regie und Genre, AJAX-Suchvorschläge, Merkliste und Kommentare, OMDb-Daten als JSON und XML, Prepared Statements, Passwort-Hashes, CSRF-Tokens, Admin mit Export. Rechts eine Skizze von Suchfeld und Datenfluss.</desc>
