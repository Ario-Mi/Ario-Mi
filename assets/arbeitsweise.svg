<title id="t">arbeitsweise.md</title>
<desc id="d">Arbeitsweise über die Projekte hinweg: Regeln in der Datenbank absichern, Sicherheit mitdenken mit Prepared Statements, Passwort-Hashes und CSRF-Tokens, isoliert testen, keine Zugangsdaten im Code, exakt rechnen mit Decimal.</desc>
