<title id="t">ausgaben-report</title>
<desc id="d">Ausgaben-Report: Python-Kommandozeilenprogramm, das Ausgaben aus CSV-Dateien als Monatsübersicht nach Kategorien auswertet, mit Eingabeprüfung, Decimal, optionalem Monatsfilter und unittest-Tests.</desc>
